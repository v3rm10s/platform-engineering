name: cicd

on:
  push:
    paths:
    - src/**
    branches:
    - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
    - name: Shorten commit id
      shell: bash
      run: |
        echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Another step
      run: |
        echo "Branch: ${{ env.branch }}"
        echo "Sha: ${{ env.sha_short }}"

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        push: true
        tags: v3rm10s/python-app:${{env.COMMIT_ID}}
    outputs:
      commit_id: ${{env.COMMIT_ID}}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v2
    - name: Modify Values File
      shell: bash
      run: |
        echo ${{needs.ci.outputs.commit_id}}
        pip install yq
        yq -Yi '.image.tag = ""${{needs.ci.outputs.commit_id}}"' charts/python-app/values.yaml

    - name: Commit changes
      uses: EndBug/add-and-commit@v9
      with:
        message: 'Updated values.yaml with commit ${{needs.ci.outputs.commit_id}}'

    - name: Install ArgoCD
      shell: bash
      run: |
        curl -ksSl -o argocd https://argocd-server.argocd/download/argocd-linux-amd64
        chmod +x argocd
        sudo mv ./argocd /usr/local/bin/argocd

    - name: ArgoCD Sync
      shell: bash
      run: |
        argocd login argocd-server.argocd \
          --insecure \
          --grpc-web \
          --username ${{ vars.ARGOCD_USERNAME }} \
          --password ${{ secrets.ARGOCD_PASSWORD }}
        argocd app sync python-app
